<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f9fd" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline | Prakash Shop</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; padding: clamp(16px, 4vw, 32px); color: #0f172a; background: radial-gradient(circle at 50% 20%, rgba(191, 219, 254, .8), transparent 34rem), #f6f9fd; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body::before, body::after { position: fixed; width: 22rem; height: 22rem; border-radius: 50%; filter: blur(1px); opacity: .55; pointer-events: none; content: ""; }
      body::before { top: -13rem; left: -10rem; background: #dbeafe; }
      body::after { right: -12rem; bottom: -14rem; background: #e0f2fe; }
      main { position: relative; z-index: 1; width: min(100%, 480px); padding: clamp(28px, 7vw, 46px); border: 1px solid #d8e4f2; border-radius: clamp(22px, 5vw, 30px); text-align: center; background: rgba(255, 255, 255, .94); box-shadow: 0 28px 70px -42px rgba(15, 23, 42, .45); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: #0f172a; font-weight: 800; text-decoration: none; }
      .brand img { width: 54px; height: 54px; border: 1px solid #bfdbfe; border-radius: 50%; box-shadow: 0 8px 22px rgba(37, 99, 235, .18); }
      .brand span { color: #2563eb; }
      .status { width: fit-content; margin: 28px auto 0; border-radius: 999px; padding: 7px 11px; color: #0369a1; background: #e0f2fe; font-size: 12px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; letter-spacing: -.035em; }
      p { max-width: 360px; margin: 0 auto; color: #5b6b80; line-height: 1.65; }
      button { margin-top: 26px; min-height: 50px; padding: 0 25px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #2563eb, #0284c7); box-shadow: 0 15px 34px rgba(37, 99, 235, .22); font: inherit; font-weight: 850; cursor: pointer; }
      button:hover { transform: translateY(-1px); box-shadow: 0 18px 38px rgba(37, 99, 235, .28); }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
      @media (max-width: 420px) { .brand { align-items: flex-start; font-size: 15px; } main { padding-inline: 22px; } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Prakash Electronics homepage">
        <img src="/logo192.png" alt="" width="54" height="54" />
        <strong>Prakash <span>Electronics</span></strong>
      </a>
      <div class="status">Connection unavailable</div>
      <h1>You're offline</h1>
      <p>Reconnect to view live products, prices, offers, bookings, and Pulse AI.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>

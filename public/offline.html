<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're offline | Prakash Shop</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e2e8f0; background: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #334155; border-radius: 24px; text-align: center; background: #111c2e; box-shadow: 0 24px 60px rgba(0, 0, 0, .28); }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 22px 0 10px; font-size: clamp(1.6rem, 6vw, 2.25rem); }
      p { margin: 0; color: #a8b4c7; line-height: 1.65; }
      button { margin-top: 24px; min-height: 46px; padding: 0 22px; border: 0; border-radius: 12px; color: #042f2e; background: #5eead4; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo192.png" alt="Prakash Electronics" width="88" height="88" />
      <h1>You're offline</h1>
      <p>Reconnect to view live products, prices, offers, bookings, and Pulse AI.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
